name: Frontend TypeScript validation
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tsconfig*.json'
      - 'package*.json'
      - '.github/workflows/inter-team-types.yml'
jobs:
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx --no-install tsc --project tsconfig.app.json --noEmit
