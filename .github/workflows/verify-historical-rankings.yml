name: Verify historical ranking PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/**'
      - 'scripts/**'
      - 'package*.json'
      - 'tsconfig.json'
      - '.github/workflows/verify-historical-rankings.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Server tests
        run: npm run test:stage-a
      - name: UI verification
        run: npm run test:stage-a:ui
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
