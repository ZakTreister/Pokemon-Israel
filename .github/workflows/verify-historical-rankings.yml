name: Verify historical ranking PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/**'
      - 'scripts/**'
      - 'package*.json'
      - 'tsconfig.json'
      - '.github/workflows/verify-historical-rankings.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Server tests
        run: npm run test:stage-a
      - name: UI verification
        if: success() || failure()
        run: npm run test:stage-a:ui
      - name: Lint
        if: success() || failure()
        run: npm run lint
      - name: TypeScript regression check against main
        if: success() || failure()
        run: |
          # The repository already has unrelated type errors. Ensure this PR
          # adds none rather than allowing the existing debt to mask regressions.
          git fetch --no-tags origin main --depth=1
          baseline="$RUNNER_TEMP/cardschool-baseline"
          git worktree add --detach "$baseline" FETCH_HEAD
          ln -s "$GITHUB_WORKSPACE/node_modules" "$baseline/node_modules"

          npx tsc -b --pretty false > "$RUNNER_TEMP/current-ts.log" 2>&1 || true
          (cd "$baseline" && npx tsc -b --pretty false) > "$RUNNER_TEMP/baseline-ts.log" 2>&1 || true

          grep -E 'error TS[0-9]+' "$RUNNER_TEMP/current-ts.log" | sed -E 's/\([0-9]+,[0-9]+\)//g' | sort > "$RUNNER_TEMP/current-ts-errors.txt" || true
          grep -E 'error TS[0-9]+' "$RUNNER_TEMP/baseline-ts.log" | sed -E 's/\([0-9]+,[0-9]+\)//g' | sort > "$RUNNER_TEMP/baseline-ts-errors.txt" || true
          echo 'Existing TypeScript diagnostics in main:'
          cat "$RUNNER_TEMP/baseline-ts-errors.txt"
          echo 'TypeScript diagnostics in PR:'
          cat "$RUNNER_TEMP/current-ts-errors.txt"
          diff -u "$RUNNER_TEMP/baseline-ts-errors.txt" "$RUNNER_TEMP/current-ts-errors.txt"
      - name: Build
        if: success() || failure()
        run: npm run build
