name: Verify historical ranking PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/**'
      - 'scripts/**'
      - 'package*.json'
      - 'tsconfig.json'
      - '.github/workflows/verify-historical-rankings.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Server tests
        run: npm run test:stage-a
      - name: UI verification
        if: success() || failure()
        run: npm run test:stage-a:ui
      - name: Lint
        if: success() || failure()
        run: npm run lint
      - name: TypeScript typecheck
        if: success() || failure()
        run: npx tsc -b --pretty false
      - name: Build
        if: success() || failure()
        run: npm run build
