<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">

<title>טורניר שווייצרי</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#d7deea;--primary:#2563eb;--primary-dark:#1d4ed8;--danger:#b42318;--danger-bg:#fee4e2;--success:#067647;--success-bg:#ecfdf3;--selected:#dbeafe;--selected-border:#2563eb;--warning:#b54708;--warning-bg:#fffaeb;--shadow:0 8px 24px rgba(15,23,42,.07)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:1050px;margin:auto;padding:16px}h1{font-size:clamp(28px,6vw,42px);margin:0 0 4px}h2,h3{margin-top:0}.sub,.note{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-weight:700;margin-bottom:6px}input,select,button{font:inherit}input,select{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px}button{min-height:44px;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover:not(:disabled){background:var(--primary-dark)}.btn-secondary{background:#eaf0fb;color:#173a72}.btn-ghost{background:#f2f4f7;color:#344054}.btn-danger{background:var(--danger-bg);color:var(--danger)}.btn-success{background:var(--success-bg);color:var(--success)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.hidden{display:none!important}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}.lang-row{display:flex;gap:8px;align-items:center}.lang-row select{width:auto;min-width:120px}.validation{margin-top:12px;padding:10px 12px;border-radius:10px;font-weight:600}.validation.ok{background:var(--success-bg);color:var(--success)}.validation.bad{background:var(--danger-bg);color:var(--danger)}.validation.warn{background:var(--warning-bg);color:var(--warning)}.mode-switch{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}.mode-btn{background:#f8fafc;border:1px solid var(--line);color:var(--text)}.mode-btn.selected{background:var(--selected);border:2px solid var(--selected-border);color:#173a72}.player-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;margin-bottom:8px}.player-actions{display:flex;gap:6px}.player-actions button{min-width:44px;padding:8px}.player-inactive input{text-decoration:line-through;color:var(--muted);background:#f8fafc}.status-pill{display:inline-block;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800;background:#eef2f7;color:#475467}.status-pill.active{background:var(--success-bg);color:var(--success)}.status-pill.finished{background:#f2f4f7;color:#475467}.status-pill.setup{background:#eff8ff;color:#175cd3}.tournament-list{display:grid;gap:12px}.tournament-card{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff}.tournament-card .meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px}.match{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;background:#fbfcfe}.match-title{font-weight:800;margin-bottom:12px}.players-choice{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;margin-bottom:12px}.choice-btn{background:#fff;border:1px solid var(--line);color:var(--text);padding:14px;border-radius:12px;font-weight:800;min-width:0;overflow-wrap:anywhere}.choice-btn.selected,.draw-btn.selected{background:var(--selected);border:2px solid var(--selected-border);color:#173a72}.draw-btn{background:#f8fafc;border:1px solid var(--line);color:#344054;min-width:84px}.score-row select:disabled{background:#f2f4f7;color:#98a2b3}.bye,.sitout{padding:12px;border:1px dashed var(--line);border-radius:10px;background:#fff;font-weight:700}.sitout{margin-top:12px;background:#fffcf5}.score-box{display:grid;grid-template-columns:1fr 1fr;gap:12px}.score-card{border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center}.score-card strong{display:block;font-size:28px}table{width:100%;border-collapse:collapse}th,td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:start;font-size:14px}th{background:#f8fafc}.scroll{overflow-x:auto}.round-block{margin-top:18px}.round-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media(max-width:640px){.wrap{padding:10px}.card{padding:14px;border-radius:12px}.grid,.score-box,.mode-switch{grid-template-columns:1fr}.players-choice{grid-template-columns:1fr}.actions,.round-actions{display:grid;grid-template-columns:1fr}.actions button,.round-actions button{width:100%}.lang-row{width:100%}.lang-row select{width:100%}.player-row{grid-template-columns:minmax(0,1fr)}.player-actions{display:grid;grid-template-columns:1fr 1fr}.player-actions button{width:100%}th,td{font-size:12px}}

</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div><h1 data-i18n="appTitle"></h1><div class="sub" data-i18n="appSubtitle"></div></div>
    <div class="lang-row"><label for="languageSelect" data-i18n="language"></label><select id="languageSelect"><option value="he">עברית</option><option value="en">English</option></select></div>
  </div>
  <section id="homeScreen" class="card">
    <div class="section-title"><div><h2 data-i18n="myTournaments"></h2><div class="sub" data-i18n="myTournamentsSubtitle"></div></div><button class="btn-primary" onclick="createTournament()" data-i18n="newTournament"></button></div>
    <div><h3 data-i18n="activeTournaments"></h3><div id="activeTournaments" class="tournament-list"></div></div>
    <div style="margin-top:22px"><h3 data-i18n="finishedTournaments"></h3><div id="finishedTournaments" class="tournament-list"></div></div>
  </section>
  <section id="tournamentShell" class="hidden">
    <div class="card"><div class="topbar"><div><button class="btn-ghost" onclick="goHome()" data-i18n="backToTournaments"></button><h2 id="tournamentTitle" style="margin-top:14px"></h2><div id="tournamentMeta" class="sub"></div></div><div class="actions"><button id="editParticipantsTopBtn" class="btn-ghost" onclick="showParticipants()" data-i18n="editParticipants"></button><button class="btn-danger" onclick="deleteTournament()" data-i18n="deleteTournament"></button></div></div></div>
    <section id="setupSection" class="card hidden">
      <h2 data-i18n="setup"></h2><label for="tournamentName" data-i18n="tournamentName"></label><input id="tournamentName">
      <label style="margin-top:16px" data-i18n="tournamentType"></label><div class="mode-switch"><button id="regularModeBtn" class="mode-btn" onclick="setMode('regular')" data-i18n="regularTournament"></button><button id="teamsModeBtn" class="mode-btn" onclick="setMode('teams')" data-i18n="teamsTournament"></button></div>
      <div id="regularSetup"><h3 data-i18n="players"></h3><div id="regularPlayers"></div><button class="btn-secondary" onclick="addPlayer()" data-i18n="addPlayer"></button></div>
      <div id="teamsSetup" class="hidden"><div class="grid"><div><label for="teamAName" data-i18n="teamAName"></label><input id="teamAName"></div><div><label for="teamBName" data-i18n="teamBName"></label><input id="teamBName"></div></div><div class="grid" style="margin-top:18px"><div><h3 id="teamAHeading"></h3><div id="teamAPlayers"></div><button class="btn-secondary" onclick="addPlayer('A')" data-i18n="addPlayer"></button></div><div><h3 id="teamBHeading"></h3><div id="teamBPlayers"></div><button class="btn-secondary" onclick="addPlayer('B')" data-i18n="addPlayer"></button></div></div></div>
      <div id="setupValidation" class="validation"></div><div class="actions"><button class="btn-primary" onclick="saveSetup(true)" data-i18n="saveSetup"></button><button class="btn-secondary" onclick="startOrContinue()" data-i18n="startContinue"></button></div>
    </section>
    <section id="participantsSection" class="card hidden"><div class="section-title"><div><h2 data-i18n="editParticipants"></h2><div class="sub" data-i18n="participantsHelp"></div></div><button class="btn-ghost" onclick="showResults()" data-i18n="back"></button></div><div id="participantsEditor"></div><div id="participantsValidation" class="validation"></div></section>
    <section id="roundSection" class="card hidden"><div class="topbar"><div><h2 id="roundTitle"></h2><div id="roundSummary" class="sub"></div></div><button class="btn-secondary" onclick="showResults()" data-i18n="showResults"></button></div><div id="matches"></div><div id="sitOutBox" class="sitout hidden"></div><div id="roundStatus" class="validation"></div><div class="actions"><button class="btn-primary" onclick="completeRound()" data-i18n="completeRound"></button></div></section>
    <section id="resultsSection" class="hidden"><div class="card"><div class="topbar"><div><h2 data-i18n="results"></h2><div class="sub" data-i18n="resultsSubtitle"></div></div><div id="resultActions" class="actions"></div></div><div id="teamScoreSection" class="hidden"><h3 data-i18n="teamScore"></h3><div class="score-box"><div class="score-card"><span id="resultTeamAName"></span><strong id="resultTeamAScore">0</strong><span data-i18n="pointsLabel"></span></div><div class="score-card"><span id="resultTeamBName"></span><strong id="resultTeamBScore">0</strong><span data-i18n="pointsLabel"></span></div></div></div><h3 style="margin-top:22px" data-i18n="individualStandings"></h3><div class="scroll"><table><thead><tr><th>#</th><th data-i18n="player"></th><th id="teamHeader" data-i18n="team"></th><th data-i18n="points"></th><th>OMP</th><th>GWP</th><th>OGP</th></tr></thead><tbody id="standingsBody"></tbody></table></div><div class="actions"><button class="btn-ghost" onclick="copyStandings()" data-i18n="copyStandings"></button></div></div><div class="card"><h3 data-i18n="roundHistory"></h3><div id="roundHistory"></div><div class="actions"><button class="btn-ghost" onclick="copyAllResults()" data-i18n="copyAllResults"></button></div></div></section>
  </section>
</div>
<script>
const TEXTS={he:{appTitle:"טורניר שווייצרי",appSubtitle:"כמה טורנירים • רגיל או נבחרות • נשמר בדפדפן",language:"שפה",myTournaments:"הטורנירים שלי",myTournamentsSubtitle:"אפשר לנהל כמה טורנירים במקביל ולצפות בטורנירים שהסתיימו.",newTournament:"+ טורניר חדש",activeTournaments:"טורנירים פעילים",finishedTournaments:"טורנירים שהסתיימו",noActive:"אין טורנירים פעילים.",noFinished:"אין טורנירים שהסתיימו.",open:"פתח",view:"צפה",deleteTournament:"מחק טורניר",backToTournaments:"← חזרה לטורנירים",setup:"הגדרה",tournamentName:"שם הטורניר",tournamentType:"סוג הטורניר",regularTournament:"טורניר רגיל",teamsTournament:"טורניר נבחרות",teamAName:"שם נבחרת א׳",teamBName:"שם נבחרת ב׳",players:"שחקנים",addPlayer:"+ הוסף שחקן",saveSetup:"שמור הגדרות",startContinue:"התחל / המשך",playerPlaceholder:"שם שחקן",removePlayer:"מחק",deactivate:"הוצא",activate:"החזר",editParticipants:"עריכת משתתפים",participantsHelp:"שחקן שכבר שיחק לא נמחק מההיסטוריה; אפשר להוציא אותו מהסבבים הבאים ולהחזיר אותו מאוחר יותר.",regularMinimum:"בטורניר רגיל חייבים להיות לפחות שני שחקנים פעילים.",teamsMinimum:"בטורניר נבחרות חייב להיות לפחות שחקן פעיל אחד בכל נבחרת.",namesRequired:"לכל השחקנים חייב להיות שם ({count} חסרים).",readyRegular:"מוכן: {count} שחקנים פעילים.",readyTeams:"מוכן: {a} פעילים ב-{teamA}, {b} פעילים ב-{teamB}.",cannotChangeMode:"לא ניתן לשנות סוג טורניר אחרי שהתחיל סיבוב.",cannotDeleteUsed:"שחקן שכבר השתתף לא ניתן למחיקה. אפשר להוציא אותו מהסבבים הבאים.",showResults:"הצג תוצאות",completeRound:"סיים סיבוב",round:"סיבוב {n}",table:"שולחן {n}",draw:"תיקו",bye:"BYE",sitOut:"לא משתתפים בסיבוב",selectScore:"בחר תוצאה",bestOf3Score:"תוצאת הטוב מ-3",chooseWinnerFirst:"בחר קודם מנצח או תיקו",allValid:"כל התוצאות תקינות.",pairingsNeedAttention:"{count} משחקים עדיין דורשים השלמה.",chooseWinner:"בחר מנצח או תיקו בשולחן {n}.",chooseScore:"בחר תוצאה בשולחן {n}.",invalidScore:"תוצאה לא תקינה בשולחן {n}.",results:"תוצאות",resultsSubtitle:"דירוג אישי ותוצאות סיבובים",pairAnotherRound:"צור סיבוב נוסף",editPreviousRound:"ערוך סיבוב קודם",back:"חזרה",teamScore:"ניקוד קבוצתי",pointsLabel:"נקודות",individualStandings:"דירוג אישי",player:"שחקן",team:"נבחרת",points:"נקודות",copyStandings:"העתק דירוג",roundHistory:"תוצאות לפי סיבוב",copyAllResults:"העתק את כל התוצאות",editRound:"ערוך סיבוב",inProgress:"בתהליך",score:"תוצאה",result:"תוצאת משחק",pending:"ממתין",won:"{name} ניצח",copied:"הועתק ללוח.",finishTournament:"סיים טורניר",reopenTournament:"פתח מחדש",finished:"הסתיים",active:"פעיל",setupStatus:"בהכנה",roundsCount:"{count} סיבובים",created:"נוצר {date}",deleteConfirm:"למחוק את הטורניר לצמיתות?",finishConfirm:"לסמן את הטורניר כהסתיים?",reopenConfirm:"לפתוח מחדש את הטורניר?",noPreviousRound:"אין סיבוב קודם לעריכה.",completeCurrentFirst:"יש לסיים את הסיבוב הנוכחי קודם.",fixSetup:"יש לתקן את הגדרת המשתתפים לפני יצירת סיבוב נוסף.",cannotEditDuringRound:"אי אפשר לשנות משתתפים בזמן שסיבוב פעיל.",newPlayerZero:"שחקן חדש שמצטרף באמצע הטורניר מתחיל עם 0 נקודות.",regularByeNote:"בטורניר רגיל, אם מספר השחקנים הפעילים אי-זוגי, שחקן אחד יקבל BYE.",teamSitoutNote:"בנבחרות בגדלים שונים, המערכת תעדיף להכניס מי שישב בחוץ בסיבוב הקודם ותנסה להימנע משני סבבים רצופים בחוץ."},en:{appTitle:"Swiss Tournament",appSubtitle:"Multiple tournaments • regular or teams • saved locally",language:"Language",myTournaments:"My Tournaments",myTournamentsSubtitle:"Run multiple tournaments in the same browser and view completed tournaments.",newTournament:"+ New Tournament",activeTournaments:"Active Tournaments",finishedTournaments:"Finished Tournaments",noActive:"No active tournaments.",noFinished:"No finished tournaments.",open:"Open",view:"View",deleteTournament:"Delete Tournament",backToTournaments:"← Back to tournaments",setup:"Setup",tournamentName:"Tournament name",tournamentType:"Tournament type",regularTournament:"Regular Tournament",teamsTournament:"Team Tournament",teamAName:"Team A name",teamBName:"Team B name",players:"Players",addPlayer:"+ Add player",saveSetup:"Save Setup",startContinue:"Start / Continue",playerPlaceholder:"Player name",removePlayer:"Delete",deactivate:"Deactivate",activate:"Reactivate",editParticipants:"Edit Participants",participantsHelp:"A player who already played stays in history; you can deactivate them for future rounds and reactivate later.",regularMinimum:"A regular tournament needs at least two active players.",teamsMinimum:"A team tournament needs at least one active player on each team.",namesRequired:"Every player must have a name ({count} missing).",readyRegular:"Ready: {count} active players.",readyTeams:"Ready: {a} active on {teamA}, {b} active on {teamB}.",cannotChangeMode:"Tournament type cannot change after a round has started.",cannotDeleteUsed:"A player who already played cannot be deleted. Deactivate them instead.",showResults:"Show Results",completeRound:"Complete Round",round:"Round {n}",table:"Table {n}",draw:"Draw",bye:"BYE",sitOut:"Sitting out this round",selectScore:"Select score",bestOf3Score:"Best-of-3 score",chooseWinnerFirst:"Choose winner or draw first",allValid:"All results are valid.",pairingsNeedAttention:"{count} matches still need attention.",chooseWinner:"Choose a winner or draw at table {n}.",chooseScore:"Choose a score at table {n}.",invalidScore:"Invalid score at table {n}.",results:"Results",resultsSubtitle:"Individual standings and round results",pairAnotherRound:"Pair Another Round",editPreviousRound:"Edit Previous Round",back:"Back",teamScore:"Team Score",pointsLabel:"points",individualStandings:"Individual Standings",player:"Player",team:"Team",points:"Points",copyStandings:"Copy Standings",roundHistory:"Round-by-Round Results",copyAllResults:"Copy All Results",editRound:"Edit Round",inProgress:"in progress",score:"Score",result:"Result",pending:"Pending",won:"{name} won",copied:"Copied to clipboard.",finishTournament:"Finish Tournament",reopenTournament:"Reopen Tournament",finished:"Finished",active:"Active",setupStatus:"Setup",roundsCount:"{count} rounds",created:"Created {date}",deleteConfirm:"Delete this tournament permanently?",finishConfirm:"Mark this tournament as finished?",reopenConfirm:"Reopen this tournament?",noPreviousRound:"There is no previous round to edit.",completeCurrentFirst:"Complete the current round first.",fixSetup:"Fix participant setup before creating another round.",cannotEditDuringRound:"Participants cannot be changed while a round is active.",newPlayerZero:"A player added mid-tournament starts with 0 points.",regularByeNote:"In a regular tournament, an odd number of active players creates one BYE.",teamSitoutNote:"With unequal team sizes, previous sit-outs are prioritized and consecutive sit-outs are avoided whenever possible."}};
const STORAGE_KEY="swiss-tournament-app-v5",OLD_KEY="swiss-tournament-v4";
function uid(prefix="id"){return prefix+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8)}function now(){return new Date().toISOString()}function defaultApp(){return{version:5,language:"he",activeTournamentId:null,tournaments:[]}}function newTournament(){const id=uid("t");return{id,name:"",mode:"regular",status:"setup",createdAt:now(),updatedAt:now(),finishedAt:null,teamAName:"קבוצה א׳",teamBName:"קבוצה ב׳",players:[{id:uid("P"),team:null,name:"",active:true},{id:uid("P"),team:null,name:"",active:true}],rounds:[],currentRound:0}}
function loadApp(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw)return JSON.parse(raw);const old=localStorage.getItem(OLD_KEY);if(old){const o=JSON.parse(old),id=o.id||uid("t");const migrated={...defaultApp(),language:o.language||"he",activeTournamentId:id,tournaments:[{...o,id,name:o.name||"",status:o.rounds?.length?"active":"setup",createdAt:o.createdAt||now(),updatedAt:now(),finishedAt:null,players:(o.players||[]).map(p=>({...p,active:p.active!==false}))}]};localStorage.setItem(STORAGE_KEY,JSON.stringify(migrated));return migrated}}catch(e){}return defaultApp()}let app=loadApp();
function saveApp(){localStorage.setItem(STORAGE_KEY,JSON.stringify(app))}function activeTournament(){return app.tournaments.find(x=>x.id===app.activeTournamentId)||null}function player(t,id){return t.players.find(p=>p.id===id)}function byId(id){return document.getElementById(id)}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}function tr(key,vars={}){let s=(TEXTS[app.language]&&TEXTS[app.language][key])||TEXTS.en[key]||key;Object.entries(vars).forEach(([k,v])=>s=s.replaceAll("{"+k+"}",v));return s}function fmt(iso){try{return new Intl.DateTimeFormat(app.language==="he"?"he-IL":"en-US",{dateStyle:"short",timeStyle:"short"}).format(new Date(iso))}catch(e){return iso}}
function applyLanguage(){document.documentElement.lang=app.language;document.documentElement.dir=app.language==="he"?"rtl":"ltr";document.title=tr("appTitle");byId("languageSelect").value=app.language;document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=tr(el.dataset.i18n));if(!byId("homeScreen").classList.contains("hidden"))renderHome();if(activeTournament()&&!byId("tournamentShell").classList.contains("hidden"))renderTournamentShell()}byId("languageSelect").addEventListener("change",e=>{app.language=e.target.value;saveApp();applyLanguage()});
function hideTournamentSections(){["setupSection","participantsSection","roundSection","resultsSection"].forEach(id=>byId(id).classList.add("hidden"))}function goHome(){app.activeTournamentId=null;saveApp();byId("tournamentShell").classList.add("hidden");byId("homeScreen").classList.remove("hidden");renderHome()}function openTournament(id){app.activeTournamentId=id;saveApp();byId("homeScreen").classList.add("hidden");byId("tournamentShell").classList.remove("hidden");renderTournamentShell();const t=activeTournament(),ar=t.rounds.find(r=>r.status==="active");if(t.status==="setup")showSetup();else if(ar){t.currentRound=ar.number;showCurrentRound()}else showResults()}function createTournament(){const t=newTournament();app.tournaments.push(t);app.activeTournamentId=t.id;saveApp();openTournament(t.id)}
function renderHome(){const active=app.tournaments.filter(t=>t.status!=="finished").sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt)),finished=app.tournaments.filter(t=>t.status==="finished").sort((a,b)=>(b.finishedAt||b.updatedAt).localeCompare(a.finishedAt||a.updatedAt));byId("activeTournaments").innerHTML=active.length?active.map(t=>tournamentCard(t)).join(""):`<div class="sub">${esc(tr("noActive"))}</div>`;byId("finishedTournaments").innerHTML=finished.length?finished.map(t=>tournamentCard(t)).join(""):`<div class="sub">${esc(tr("noFinished"))}</div>`}function tournamentCard(t){const sk=t.status==="finished"?"finished":t.status==="setup"?"setupStatus":"active",ol=t.status==="finished"?tr("view"):tr("open"),title=t.name||tr(t.mode==="teams"?"teamsTournament":"regularTournament");return`<div class="tournament-card"><div class="section-title"><div><strong>${esc(title)}</strong><div class="meta"><span class="status-pill ${t.status}">${esc(tr(sk))}</span><span>${esc(tr("roundsCount",{count:t.rounds.length}))}</span><span>${esc(tr("created",{date:fmt(t.createdAt)}))}</span></div></div><button class="btn-primary" onclick="openTournament('${t.id}')">${esc(ol)}</button></div></div>`}

function roundText(t,r){const lines=[tr("round",{n:r.number}),`${tr("player")} 1\t${tr("score")}\t${tr("player")} 2\t${tr("result")}`];r.matches.forEach(m=>{const p1=player(t,m.player1Id);if(!m.player2Id){lines.push(`${p1.name}\t-\t${tr("bye")}\t${tr("bye")}`);return}const p2=player(t,m.player2Id),res=m.result==="player1"?tr("won",{name:p1.name}):m.result==="player2"?tr("won",{name:p2.name}):tr("draw");lines.push(`${p1.name}\t${m.score}\t${p2.name}\t${res}`)});if((r.sitOutPlayerIds||[]).length)lines.push(`${tr("sitOut")}\t${r.sitOutPlayerIds.map(id=>player(t,id)?.name||"").join(", ")}`);return lines.join("\n")}function copyStandings(){const t=activeTournament(),st=calculateStandings(t),headers=["#",tr("player")];if(t.mode==="teams")headers.push(tr("team"));headers.push(tr("points"),"OMP","GWP","OGP");const lines=[headers.join("\t")];st.forEach((s,i)=>{const p=player(t,s.playerId),row=[i+1,p.name];if(t.mode==="teams")row.push(p.team==="A"?t.teamAName:t.teamBName);row.push(s.points,pct(s.omp),pct(s.gwp),pct(s.ogp));lines.push(row.join("\t"))});copyText(lines.join("\n"))}function copyAllResults(){const t=activeTournament();copyText(t.rounds.filter(r=>r.status==="completed").map(r=>roundText(t,r)).join("\n\n"))}function copyText(text){if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>alert(tr("copied"))).catch(()=>fallbackCopy(text));else fallbackCopy(text)}function fallbackCopy(text){const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();alert(tr("copied"))}
applyLanguage();if(app.activeTournamentId&&activeTournament()){byId("homeScreen").classList.add("hidden");byId("tournamentShell").classList.remove("hidden");renderTournamentShell();const t=activeTournament(),ar=t.rounds.find(r=>r.status==="active");if(t.status==="setup")showSetup();else if(ar){t.currentRound=ar.number;showCurrentRound()}else showResults()}else{byId("homeScreen").classList.remove("hidden");byId("tournamentShell").classList.add("hidden");renderHome()}
